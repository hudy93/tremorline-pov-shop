# Excerpt of Stripe's OpenAPI document from API version 2022-11-15: PaymentIntent.charges removed,
# PaymentIntent.latest_charge added.
openapi: 3.0.0
info: { title: Stripe API (excerpt), version: "2022-11-15" }
paths:
  /v1/payment_intents/{intent}:
    get:
      parameters:
        - { name: intent, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/payment_intent" }
components:
  schemas:
    payment_intent:
      type: object
      required: [id, object, amount, currency, status]
      properties:
        id: { type: string }
        object: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string }
        latest_charge: { type: string, nullable: true }
