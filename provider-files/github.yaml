# Excerpt of GitHub's REST description before the OAuth Authorizations API was removed (November 2020).
openapi: 3.0.3
info: { title: GitHub v3 REST API (excerpt), version: "1.1.4" }
paths:
  /authorizations:
    get:
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/authorization" } }
    post:
      responses:
        "201":
          description: Response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/authorization" }
  /user/repos:
    get:
      parameters:
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/repository" } }
components:
  schemas:
    authorization:
      type: object
      required: [id, token, scopes]
      properties:
        id: { type: integer }
        token: { type: string }
        scopes: { type: array, items: { type: string } }
    repository:
      type: object
      required: [id, full_name, private, html_url]
      properties:
        id: { type: integer }
        full_name: { type: string }
        private: { type: boolean }
        html_url: { type: string }
